<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    CSP — see docs/IMPROVEMENTS.md A3 for the audit.
    style-src 'unsafe-inline': required by xterm and gridstack which set inline styles on DOM nodes.
    img-src https:: required for markdown rendering of remote images in PR/issue bodies and changelogs.
    connect-src: api.github.com (team personas), raw.githubusercontent.com (persona file download),
                 github.com (discussions atom feed). WebRTC STUN traffic is not gated by connect-src.
    connect-src ws://localhost:5173: Vite HMR WebSocket in dev (B9). Localhost-scoped, no
                                      production exposure. Mirror http://localhost:5173 covered by
                                      'self' when the page is loaded from the dev server.
    frame-src 'none': renderer has no iframes; the browser-tab uses <webview> which is its own
                      isolated WebContents and not subject to page CSP.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://github.com ws://localhost:5173 http://localhost:5173; frame-src 'none'; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-yard</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="xterm.css">
  <link rel="stylesheet" href="vendor/gridstack.min.css">
</head>
<body>
  <div id="app">

    <!-- ── Titlebar strip (38px, macOS traffic-light height) ── -->
    <div id="titlebar">
      <!-- macOS traffic lights sit here, -webkit-app-region:drag fills gap -->
      <div id="titlebar-traffic"></div>

      <!-- Project / workspace name picker -->
      <button id="titlebar-project-picker" class="titlebar-picker" title="Switch project">
        <span id="titlebar-project-name">Projects</span>
        <span class="picker-caret">▾</span>
      </button>

      <!-- Breadcrumb: ProjectName › SessionName or Feature -->
      <div id="titlebar-breadcrumb" aria-label="Current location">
        <span class="breadcrumb-item" id="breadcrumb-project"></span>
        <span class="breadcrumb-sep" id="breadcrumb-sep" aria-hidden="true" style="display:none">›</span>
        <span class="breadcrumb-item" id="breadcrumb-context"></span>
      </div>

      <!-- Right-side icon actions -->
      <div id="titlebar-actions">
        <button id="btn-add-session" class="icon-btn titlebar-btn" title="New Session (Ctrl+Shift+N)" aria-label="New Session">+</button>
        <button id="btn-add-session-menu" class="icon-btn titlebar-btn" title="More session options" aria-haspopup="menu" aria-label="More session options">▾</button>
        <button id="btn-add-browser-tab" class="icon-btn titlebar-btn" title="New Browser Tab" aria-label="New Browser Tab">
          <span class="toolbar-icon toolbar-icon-browser" aria-hidden="true"></span>
        </button>
        <button id="btn-toggle-swarm" class="icon-btn titlebar-btn" title="Toggle Swarm Mode (Ctrl+\)" aria-label="Toggle Swarm Mode">&#x229E;</button>
        <button id="btn-broadcast" class="icon-btn titlebar-btn" title="Broadcast to sessions (right-click to pick)" aria-label="Broadcast to sessions" aria-haspopup="menu" aria-pressed="false">&#x1F4E1;</button>
        <button id="btn-toggle-terminal" class="icon-btn titlebar-btn" title="Toggle Terminal (Ctrl+`)" aria-label="Toggle Terminal">&#x2588;</button>
        <button id="btn-add-mcp-inspector" class="icon-btn titlebar-btn" title="MCP Inspector" style="font-size:11px;font-weight:600;">MCP</button>
        <button id="btn-usage-stats" class="icon-btn titlebar-btn" title="Usage Stats (Ctrl+Shift+U)" aria-label="Usage Stats">&#x2261;</button>
        <button id="btn-help" class="icon-btn titlebar-btn" title="Session Indicators Help (F1)" aria-label="Help">?</button>
      </div>
    </div>

    <!-- ── App body: sidebar + sidebar-resize + main area ──── -->
    <div id="app-body">
      <div id="sidebar">
        <!-- sidebar header: just the toggle + title (no action buttons in new design) -->
        <div id="sidebar-header">
          <button id="btn-toggle-sidebar" class="icon-btn" title="Toggle Sidebar (Cmd+B)" aria-label="Toggle Sidebar" style="font-size:13px;">&#x25E7;</button>
          <span class="sidebar-title">Projects</span>
          <div class="sidebar-header-actions">
            <button id="btn-preferences" class="icon-btn" title="Preferences" aria-label="Preferences">&#x2699;</button>
            <button id="btn-add-project" class="icon-btn" title="New Project (Ctrl+Shift+P)" aria-label="New Project">+</button>
          </div>
        </div>

        <div id="sidebar-content">
          <!-- Recents section (injected by sidebar.ts) -->
          <div id="sidebar-recents" class="sidebar-section"></div>

          <!-- Projects section -->
          <div id="sidebar-projects-section" class="sidebar-section">
            <div class="sidebar-section-header">Projects</div>
            <div id="project-list"></div>
          </div>

          <div id="git-panel"></div>
          <div id="git-actions-panel"></div>
        </div>

        <div id="sidebar-discussions"></div>

        <!-- Pinned footer: settings + version -->
        <div id="sidebar-footer"></div>
      </div>

      <div id="sidebar-resize-handle"></div>

      <div id="main-area">
        <!-- Feature rail: replaces horizontal tab bar for feature switching -->
        <div id="feature-rail" role="tablist" aria-label="Features">
          <!-- Tab bar content is preserved for JS compatibility;
               session tabs render here but are visually hidden — session switching
               happens via sidebar. Feature tabs are rendered as rail items. -->
          <div id="tab-bar" aria-hidden="true">
            <div id="tab-list"></div>
            <div id="git-status"></div>
            <!-- tab-actions removed from tab bar; buttons moved to titlebar -->
            <div id="tab-actions" style="display:none;"></div>
          </div>

          <!-- Visual feature nav icons (populated by feature-rail.ts) -->
          <div id="feature-rail-icons"></div>
        </div>

        <!-- Content area: stacks vertically, fills remaining space beside the rail -->
        <div id="content-area">
          <div id="terminal-container"></div>
          <div id="project-terminal-resize-handle" class="hidden"></div>
          <div id="project-terminal-panel" class="hidden">
            <div id="project-terminal-header">
              <span class="project-terminal-title">Terminal</span>
              <div class="project-terminal-header-actions">
                <button id="btn-new-terminal" class="icon-btn" title="New Terminal" aria-label="New Terminal">+</button>
                <button id="btn-close-terminal" class="icon-btn" title="Close Terminal" aria-label="Close Terminal">&times;</button>
              </div>
            </div>
            <div id="project-terminal-body">
              <div id="project-terminal-container"></div>
              <div id="project-terminal-sidebar" class="hidden"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
      <div id="modal-actions">
        <button id="modal-cancel" class="modal-btn">Cancel</button>
        <button id="modal-confirm" class="modal-btn primary">Create</button>
      </div>
    </div>
  </div>

  <!-- Vite dev/build entry. Legacy esbuild path rewrites this back to <script src="index.js"></script>
       in scripts/copy-assets.js. -->
  <script type="module" src="./index.ts"></script>
</body>
</html>
